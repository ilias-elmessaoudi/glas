<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glas">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Glas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hintergrund: zwei Ebenen, die beim Songwechsel ineinander überblenden -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-ebene aktiv"></div>
    <div class="ambient-ebene"></div>
    <div class="ambient-koernung"></div>
  </div>

  <main id="ansicht" class="ansicht"></main>

  <section id="mini" class="mini glas" hidden>
    <img class="mini-cover" alt="">
    <div class="mini-text"><b></b><span></span></div>
    <button class="knopf mini-play" data-aktion="playpause" aria-label="Abspielen/Pause"></button>
    <button class="knopf mini-weiter" data-aktion="weiter" aria-label="Nächster Titel"></button>
    <div class="mini-fortschritt"><i></i></div>
  </section>

  <nav id="tabs" class="tabs glas">
    <a href="#/" data-tab="start"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Start</span></a>
    <a href="#/suche" data-tab="suche"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Suche</span></a>
    <a href="#/bibliothek" data-tab="bibliothek"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.3.6 1.9-.6 5 17.3-1.9.6z"/></svg><span>Bibliothek</span></a>
  </nav>

  <section id="player" class="player" hidden>
    <div class="player-griff" data-aktion="schliessen"></div>
    <header class="player-kopf">
      <button class="knopf klein" data-aktion="schliessen" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="player-quelle"><small>Spielt von</small><b></b></div>
      <button class="knopf klein" data-aktion="warteschlange" aria-label="Warteschlange"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h8v2H3zm15-5v6.3a3 3 0 1 0 2 2.7V9h3V7h-5z"/></svg></button>
    </header>
    <div class="player-cover-rahmen"><img class="player-cover" alt=""></div>
    <div class="player-info">
      <div class="player-titel"><b></b><span></span></div>
      <button class="knopf klein herz" data-aktion="like" aria-label="Lieblingssong"></button>
    </div>
    <div class="regler" id="zeit">
      <div class="regler-spur"><i></i></div>
      <div class="zeiten"><span>0:00</span><span>0:00</span></div>
    </div>
    <div class="steuerung">
      <button class="knopf klein" data-aktion="zufall" aria-label="Zufallswiedergabe"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.2l-3.1 4 3.1 4H17v-3l4 4-4 4v-3h-3.2l-3.6-4.7L6.6 18H3v-2h2.6l3.3-4.3L5.6 8H3V6h3.6l3.5 4.5L13.8 6H17z"/></svg></button>
      <button class="knopf gross" data-aktion="zurueck" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
      <button class="knopf riesig glas" data-aktion="playpause" aria-label="Abspielen/Pause"></button>
      <button class="knopf gross" data-aktion="weiter" aria-label="Nächster Titel"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg></button>
      <button class="knopf klein" data-aktion="wiederholen" aria-label="Wiederholen"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    </div>
    <div class="regler lautstaerke" id="laut">
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
      <div class="regler-spur"><i></i></div>
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm12.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </div>
    <footer class="player-fuss">
      <button class="geraet-knopf" data-aktion="geraete"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H4zm-2 12h20v2H2z"/></svg><span></span></button>
    </footer>
  </section>

  <div id="blatt" class="blatt" hidden>
    <div class="blatt-hinter" data-aktion="blatt-zu"></div>
    <div class="blatt-inhalt glas"></div>
  </div>

  <div id="toast" class="toast glas" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
